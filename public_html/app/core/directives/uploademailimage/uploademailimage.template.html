<button class="btn btn-primary" 
        type="file" 
        ngf-select="uploadMainImage($file, $invalidFiles)" 
        accept="image/jpeg" 
        ngf-max-height="200" 
        ngf-max-width="700" 
        ngf-max-size="30KB" 
        ng-disabled="isDisabled">
        {{translationObj.main.buttontitleloadmainimage}}
</button>
